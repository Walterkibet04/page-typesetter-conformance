[task]
name = "afterquery/page-typesetter-conformance"

[metadata]
author_name = "walter kibet"
author_email = "kibetwalter726@gmail.com"
difficulty_explanation = "This is conformance work against a black box, as done when a team has to reimplement a layout engine or match a legacy typesetter whose source is not available: a reference build prints the correct layout for any document, the written description gives the file format, the output format and the page geometry exactly but only describes the rules, and the solver has to find the rules and their constants by experiment. The reference is an invented typesetter whose settings deliberately differ from the usual ones (so that knowledge of TeX or of common typesetting practice gives the rules but not the numbers), and the test documents are synthetic text with the structure of real copy, so nothing can be looked up. What has to be found: a Knuth-Plass total-fit paragraph breaker whose badness scale, glue stretch, tolerance passes, line, hyphen and hard-hyphen penalties, double-hyphen, fitness-mismatch, final-hyphen and short-last-line demerits and tie rule are not given (a breaker that is almost right gives a different optimal breaking for a whole paragraph and moves every later line and page); the pattern, minimum piece lengths, never-split letter pairs and exception words of the hyphenation; how the spare points of a justified line are spread; the scale and rounding of footnote widths; the thresholds for splitting a paragraph, for the keep-with-next unit of a heading, for the last line of a split paragraph and for a hyphen at the foot of a page; how headings that follow a heading are spaced; how a footnote is split between pages and carried, with its own minimums; and the page-reference scheme, in which a reference prints the page of an anchor as a roman numeral of page-dependent width, so the document is laid out again from a fixed start assumption until the anchor pages stop changing, with a cap on the number of layouts that some documents reach. The rules interact (the footnote block height changes where a line falls, which changes widow decisions, which changes heading placement, which changes which page an anchor lands on and so the width of a reference), the output of thirty long documents, each built so that nearly every rule and setting decides part of it, has to match exactly, and the sample documents show only part of the behaviour, so the solver has to design experiments with the reference build, fit the settings, and check hypotheses on generated documents. A specialist needs well over a working day."
solution_explanation = "The reference solution is the finished program. The paragraph breaker is a dynamic program over the break points of the paragraph. Its state is the break point, the number of lines already set capped at three (so the drop-cap and first-line indents apply to the right lines), and the fitness class of the last line; the value is the minimum total demerits with the lexicographically smallest break list as the tie rule. Badness is 85 times the cube of the adjustment ratio in integer arithmetic, with the shrink and stretch of a glue taken as 1 and 3. A line costs (13 + badness) squared plus the square of a penalty (65 for a soft hyphen break, 20 for a hard one); two hyphen breaks in a row cost 4200, fitness classes that differ by more than one cost 2600, a hyphen break on the line before the last costs 2200, and a last line that is one word narrower than 44 points costs 1700. The breaker runs with tolerance 650, then 3500, then with overfull lines allowed. Soft break points need a vowel and consonant pattern with at least 3 letters before and 2 after, never split the pairs th, ch, sh, tr, gr, cl and pl, and have four exception words. The spare points of a justified line are spread evenly over the gaps (Bresenham style). Footnote word widths are 18/25 of the whole word rounded down once, a footnote line may reach the measure exactly, and the footnote block rows are the ceiling of (18 + 9L)/12. Paragraphs of fewer than six lines are never split, a split leaves at least 2 lines before it and 3 after it, the last line placed on a page may not end in a soft hyphen, a heading is kept with the first three lines of the next paragraph (the whole paragraph if it is shorter than six lines), recursing through consecutive headings, and a heading that follows a heading has no space before it. A footnote may be split when at least 3 lines stay and at least 2 are carried (a single left-over line moves back one); the page is closed after a split, and the carried lines and the footnotes after the split one open the next page, or an extra last page. Layout is a function of a table of anchor pages: the document is laid out with every anchor assumed on page 3, references are replaced by lower-case roman numerals, and the layout is repeated with the pages the anchors fell on until the table is stable or 6 layouts are done. The oracle shipped to the solver, /app/folio_ref, is a static C port of this program."
verification_explanation = "tests/test.sh runs /app/folio.py on thirty hidden documents (24 to 49 pages each) and compares the returned dictionary with the expected output for each document, exactly: same number of pages, same entries in the same order, same kind, page, y, x, text and gap list for every entry. The comparison uses integers and strings only, so there is no tolerance and nothing depends on the clock. All thirty documents must match for reward 1. A missing file, an exception, or taking more than 30 minutes for the thirty documents together (the instruction states this; the reference solution needs about 6 seconds) gives 0. A static check of folio.py also has to pass, and the instruction states its limits: one file of at most 150 kB, no subprocess, ctypes, multiprocessing or os process-launching calls, and no exec, eval or dynamic imports, so that the shipped reference build cannot be run from the solution. The reference build is not in the verifier container (only /app/folio.py is carried over). The submitted code is run in a child process as an unprivileged user, receives only the document texts on standard input, and cannot read /tests (which holds the expected outputs) or write /logs/verifier; the comparison and the reward are done by the parent, which also kills every process of that user before it finishes. The expected outputs come from the Python reference solution, and the C reference build given to the solver prints the same output for all thirty hidden documents and for the 1640 generated documents of the earlier rounds. Why the documents are built this way: the first version graded fifteen generated documents and the second a hundred, chosen so that each of 99 near-correct variants of the reference changed at least 8 of them. In both, the probe agents that failed mostly had one or two settings slightly off (a line penalty of 12 instead of 13, demerits a few hundred away, overfull words not hyphenated in the last-resort pass), and since such a misfit changes only a few percent of ordinary documents they matched 14 of 15 or 95 of 100, which read as near misses although the rules had not been found. The hidden documents are now dense: any single wrong rule or setting changes most of them, so a run either matches everything or clearly fails. How they were built. 128 variants of the reference solution were written, each getting one rule or constant wrong: every breaker constant moved about 5 percent each way (line penalty 12 and 14, soft and hard hyphen penalties 60/70 and 15/25, double hyphen 4000/4400, fitness mismatch 2500/2700, final hyphen 2000/2400, short last line 1500/1900 and its width 40/48, tolerances 600/700 and 3000/4000, badness scale 80/90) and moved further, the tolerance passes, the tie rule, the last-resort pass, every hyphenation minimum, letter pair and exception word, the spread of spare points, the footnote scale, rounding, spacing and split minimums, every pagination threshold, the drop-cap rows, the fresh-page rule, the anchor page, the start assumption, the layout cap and the unknown-reference mark. Paragraphs that a breaker variant breaks differently were found by random search over 4400 paragraphs and by hill-climbing paragraphs word by word until their best breaking flips between the true and the wrong constant. Each document then has three parts: an opening of a few blocks whose page references never settle (the anchors swap pages on every layout), so the layout cap and the start assumption decide its output; a generated body with about 13 of those paragraphs inserted, each straight after a paragraph, the context it was found in, so that every breaker variant changes the document; and a body and tail edited by hill-climbing until as many pagination and footnote-splitting variants as possible change it, closed by a short paragraph whose footnotes are too tall for any page, which always lands on a fresh page. Result: 9 of the 128 variants change none of the 44 candidate documents, and in the earlier pool of about 1000 generated documents none of them changed more than two (badness in floating point, ties going to the later break list, the line count left out of the breaker state when there is no indent, the last-resort pass trying further overfull lines, y counted as a vowel, a hard hyphen allowed after the first character, no page close after a footnote split, an extra tolerance pass of 200 before the others, a layout cap of 10, since the anchors swap with period 2 and caps of the same parity agree). Of the other 119, 106 change all thirty documents; the rest change 24 (drop-cap split rows), 25 (keep-with-next of 4 lines), 27 (drop-cap padding, keep of 2 lines, 1 leading line), 28 or 29 (footnote split minimums and move-back, split threshold 5 or 7, keep without footnotes, start assumption page 2). Every document is changed by at least 117 of the 119. Run through the verifier, the settings of a failed probe agent (line penalty 12, fitness 2500, double hyphen 4000, final hyphen 2000, extra tolerance pass 200) match 0 of 30, the last-resort pass without hyphenation matches 0, and the worst single-rule variant matches 6. The reference solution passes all thirty and the first draft passes none."
